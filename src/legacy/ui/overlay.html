<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none}
  #cur{position:absolute;left:0;top:0;width:26px;height:26px;opacity:0;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .3s;filter:drop-shadow(0 0 8px rgba(187,169,255,.9))}
  #cur svg{width:100%;height:100%}
  #ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #bba9ff;opacity:0}
  #ring.go{animation:ring .5s ease-out}
  @keyframes ring{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
  #frame{position:absolute;border:2px dashed #bba9ff;border-radius:8px;opacity:0;transition:opacity .3s,left .4s,top .4s,width .4s,height .4s;box-shadow:0 0 24px rgba(128,104,232,.35)}
  #frame small{position:absolute;left:8px;top:-20px;font:11px Consolas,monospace;color:#f3eefe;background:#8068e8;border-radius:6px;padding:2px 8px}
</style>
</head>
<body>
<div id="frame"><small id="fl">looking</small></div>
<div id="ring"></div>
<div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l17 8-7.5 2.2L9.5 20z" fill="#8068e8" stroke="#f3eefe" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
<script src="overlay.js"></script>
</body>
</html>
